name: RCS

on:
  push:
    branches:
      - main
    paths:
      - 'packages/rcs/**'
      - 'bun.lock'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/rcs.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'packages/rcs/**'
      - 'bun.lock'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/rcs.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: bun run rcs:typecheck

      - name: Lint
        run: bun run rcs:lint

      - name: Test
        run: bun run rcs:test

      - name: Build
        run: bun run rcs:build
