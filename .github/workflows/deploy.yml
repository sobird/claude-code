name: Publish & deploy RCS

# The RCS release pipeline: build and push the image, then roll that pinned tag
# onto the self-hosted server. Called from release.yml for an RCS release; kept
# in one file so both halves of the release live together, but as two separate
# jobs (build has `packages: write`, the rollout only needs SSH).
#
# The caller must grant `packages: write` on the job that `uses` this workflow:
# a reusable workflow's GITHUB_TOKEN permissions are capped by the caller.

on:
  workflow_call:
    inputs:
      version:
        description: RCS version (release tag without the rcs-v prefix, e.g. 0.2.0)
        required: true
        type: string
      tag:
        description: Git tag to build from (e.g. rcs-v0.2.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-rcs-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/rcs/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rcs:${{ inputs.version }}
            ghcr.io/${{ github.repository_owner }}/rcs:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-rcs:
    needs: publish-rcs-image
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      # The compose file and Caddyfile are versioned config: ship the ones from
      # the release tag so the server never drifts from the image being rolled
      # out. `.env` holds secrets and stays server-side — CI never touches it.
      - name: Copy the compose stack to the server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.RCS_DEPLOY_HOST }}
          username: ${{ secrets.RCS_DEPLOY_USER }}
          key: ${{ secrets.RCS_DEPLOY_SSH_KEY }}
          port: ${{ secrets.RCS_DEPLOY_PORT || 22 }}
          source: 'packages/rcs/docker-compose.yml,packages/rcs/Caddyfile'
          target: ${{ secrets.RCS_DEPLOY_PATH }}
          strip_components: 2

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          RCS_IMAGE: ghcr.io/${{ github.repository_owner }}/rcs:${{ inputs.version }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          DEPLOY_PATH: ${{ secrets.RCS_DEPLOY_PATH }}
        with:
          host: ${{ secrets.RCS_DEPLOY_HOST }}
          username: ${{ secrets.RCS_DEPLOY_USER }}
          key: ${{ secrets.RCS_DEPLOY_SSH_KEY }}
          port: ${{ secrets.RCS_DEPLOY_PORT || 22 }}
          envs: RCS_IMAGE,GHCR_USER,GHCR_TOKEN,DEPLOY_PATH
          script_stop: true
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            # Compose silently applies the insecure demo defaults when `.env` is
            # absent; refuse instead of running production with weak secrets.
            [ -f .env ] || { echo "missing $DEPLOY_PATH/.env" >&2; exit 1; }
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            RCS_IMAGE="$RCS_IMAGE" docker compose pull
            RCS_IMAGE="$RCS_IMAGE" docker compose up -d --no-build --remove-orphans
            docker logout ghcr.io
            docker image prune -f
