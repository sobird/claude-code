# You may also need to set "Allow GitHub Actions to create and approve pull requests" under repository Settings > Actions > General.

name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write
  issues: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      rcs_released: ${{ steps.release.outputs['packages/rcs--release_created'] }}
      rcs_version: ${{ steps.release.outputs['packages/rcs--version'] }}
      rcs_tag: ${{ steps.release.outputs['packages/rcs--tag_name'] }}
    steps:
      - name: Release please
        uses: googleapis/release-please-action@v5
        id: release
        with:
          # A PAT is preferred. Branch updates made with GITHUB_TOKEN do not
          # start downstream workflow runs, so CI lands on the release PR as
          # `action_required` and never executes; a PAT-authored update runs CI
          # automatically. Falls back to GITHUB_TOKEN when the secret is unset.
          token: ${{ secrets.MY_RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # No release-type input: its presence switches the action to simple
          # mode and makes it ignore release-please-config.json.
          # create a release from a path other than the repository's root
          # path: pkg/cmd
          # The short ref name of the branch or tag that triggered
          # the workflow run. For example, `main` or `1.x`
          # target-branch: ${{ github.ref_name }}

          # If true, do not attempt to create releases.
          # This is useful if splitting release tagging from PR creation.
          # skip-github-release: true

  publish:
    if: needs.release.outputs.created
    needs: release
    uses: ./.github/workflows/publish.yml
    secrets: inherit

  # Builds and pushes the RCS image, then rolls that pinned tag onto the
  # self-hosted server. Both steps live in deploy.yml (two separate jobs) so
  # all RCS release work is in one file. Runs only for an RCS release.
  deploy:
    if: needs.release.outputs.rcs_released == 'true'
    needs: release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.release.outputs.rcs_version }}
      tag: ${{ needs.release.outputs.rcs_tag }}
    secrets: inherit
