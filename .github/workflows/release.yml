# You may also need to set "Allow GitHub Actions to create and approve pull requests" under repository Settings > Actions > General.

name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write
  issues: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      rcs_released: ${{ steps.release.outputs['packages/rcs--release_created'] }}
      rcs_version: ${{ steps.release.outputs['packages/rcs--version'] }}
      rcs_tag: ${{ steps.release.outputs['packages/rcs--tag_name'] }}
    steps:
      - name: Release please
        uses: googleapis/release-please-action@v4
        id: release
        with:
          # this assumes that you have created a personal access token
          # (PAT) and configured it as a GitHub action secret named
          # `MY_RELEASE_PLEASE_TOKEN` (this secret name is not important).
          token: ${{ secrets.GITHUB_TOKEN }}
          # No release-type input: its presence switches the action to simple
          # mode and makes it ignore release-please-config.json.
          # create a release from a path other than the repository's root
          # path: pkg/cmd
          # The short ref name of the branch or tag that triggered
          # the workflow run. For example, `main` or `1.x`
          # target-branch: ${{ github.ref_name }}

          # If true, do not attempt to create releases.
          # This is useful if splitting release tagging from PR creation.
          # skip-github-release: true

  publish:
    if: needs.release.outputs.created
    needs: release
    uses: ./.github/workflows/publish.yml
    secrets: inherit

  publish-image:
    if: needs.release.outputs.rcs_released == 'true'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.rcs_tag }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/rcs/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rcs:${{ needs.release.outputs.rcs_version }}
            ghcr.io/${{ github.repository_owner }}/rcs:latest
