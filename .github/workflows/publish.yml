# Publishes the release artifacts: the CLI to npm, the dsh plugin to npm, and,
# for an RCS release, the pinned container image the deploy workflow rolls out.

name: Publish

on:
  workflow_call:
    inputs:
      cli_released:
        description: Whether this release includes the root CLI package
        required: false
        type: boolean
        default: false
      rcs_released:
        description: Whether this release includes packages/rcs
        required: false
        type: boolean
        default: false
      rcs_version:
        description: RCS version (release tag without the rcs-v prefix, e.g. 0.2.0)
        required: false
        type: string
        default: ''
      rcs_tag:
        description: RCS git tag to build from (e.g. rcs-v0.2.0)
        required: false
        type: string
        default: ''
      plugin_released:
        description: Whether this release includes packages/dsh-rcs-plugin
        required: false
        type: boolean
        default: false
      plugin_tag:
        description: dsh plugin git tag, e.g. dsh-rcs-plugin-v0.2.0
        required: false
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  claude-code-npm:
    if: inputs.cli_released
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up
        uses: ./.github/actions/setup

      - name: Build CLI
        run: bun run build
      - name: Publish to NPM
        run: npm publish ./dist

  # The plugin publishes from its own directory; `prepublishOnly` builds
  # lib/index.js. Auth is OIDC trusted publishing, so provenance is automatic
  # and no long-lived npm token is stored. The package name must exist on npm
  # with this workflow registered as its trusted publisher before the first
  # automated release — bootstrap it once locally (see the package README).
  dsh-rcs-plugin-npm:
    if: inputs.plugin_released
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.plugin_tag }}
          persist-credentials: false

      - name: Set up
        uses: ./.github/actions/setup

      - name: Publish to NPM
        working-directory: packages/dsh-rcs-plugin
        run: npm publish --access public --provenance

  # Builds from the release tag so the image never drifts from the version
  # release-please tagged. Runs only for an RCS release.
  rcs-image:
    if: inputs.rcs_released
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.rcs_tag }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/rcs/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rcs:${{ inputs.rcs_version }}
            ghcr.io/${{ github.repository_owner }}/rcs:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
