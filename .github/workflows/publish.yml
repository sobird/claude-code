name: Publish

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up
        uses: ./.github/actions/setup

      - name: Build CLI
        run: bun run build
      - name: Publish to NPM
        run: npm publish ./dist
