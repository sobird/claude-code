name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Decides which area changed so the heavy jobs only run when relevant. Kept as
  # a job (not workflow-level `paths`) so the workflow always triggers: a
  # required check that never reports blocks merges, while a skipped job counts
  # as a pass. Shared files flip both flags; a docs-only change flips neither.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
      rcs: ${{ steps.filter.outputs.rcs }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            cli:
              - 'src/**'
              - 'tests/**'
              - 'scripts/**'
              - 'tsconfig.json'
              - 'bunfig.toml'
              - 'package.json'
              - 'bun.lock'
              - '.bun-version'
              - '.oxlintrc.json'
              - '.oxfmtrc.jsonc'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            rcs:
              - 'packages/rcs/**'
              - 'package.json'
              - 'bun.lock'
              - '.bun-version'
              - '.oxlintrc.json'
              - '.oxfmtrc.jsonc'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

  test:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ${{ matrix.platform }}
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/setup

      - name: Type Check
        run: bun run typecheck

      - name: Build ☕️
        run: bun run build

      - name: Test
        run: bun run test

  lint:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/setup

      - name: Check formatting
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

  # RCS lives in the same workflow so one push runs one CI run; the gates are
  # the package's own (`rcs:*`) because the root gates exclude packages/rcs.
  # `fmt:check` runs here too — the CLI lint job would otherwise be the only
  # formatting check, and it no longer runs for rcs-only changes.
  rcs:
    needs: changes
    if: needs.changes.outputs.rcs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/setup

      - name: Check formatting
        run: bun run fmt:check

      - name: Type check
        run: bun run rcs:typecheck

      - name: Lint
        run: bun run rcs:lint

      - name: Test
        run: bun run rcs:test

      - name: Build
        run: bun run rcs:build
