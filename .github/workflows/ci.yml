name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ${{ matrix.platform }}
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install Dependencies
        run: bun install
        env:
          # @vscode/ripgrep's postinstall downloads a prebuilt binary from the
          # GitHub API; without a token, shared runner IPs blow past the
          # anonymous rate limit and the install fails with HTTP 403.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type Check
        run: bun run typecheck

      - name: Build ☕️
        run: bun run build

      - name: Test
        run: bun run test

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install Dependencies
        run: bun install
        env:
          # @vscode/ripgrep's postinstall downloads a prebuilt binary from the
          # GitHub API; without a token, shared runner IPs blow past the
          # anonymous rate limit and the install fails with HTTP 403.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        run: bun run fmt:check

      - name: Lint
        run: bun run lint
